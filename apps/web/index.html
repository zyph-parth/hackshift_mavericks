<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141311" />
    <meta name="description" content="LaunchLoop: hire by proof, not resumes. Verified talent, funded proof tasks, and a founder studio in one loop." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LaunchLoop · Hire by proof</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ll-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
